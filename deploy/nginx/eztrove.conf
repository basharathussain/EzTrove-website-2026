# /etc/nginx/sites-available/eztrove.conf
# Host-level nginx for the EzTrove test deployment.
# Reverse-proxies public traffic to the Docker container bound on 127.0.0.1:12090.
#
# Install:
#   sudo cp deploy/nginx/eztrove.conf /etc/nginx/sites-available/eztrove
#   sudo ln -sf /etc/nginx/sites-available/eztrove /etc/nginx/sites-enabled/eztrove
#   sudo nginx -t && sudo systemctl reload nginx

# ────────────────────────────────────────────────────────────────────────────
# HTTP — currently the only listener (raw IP, no SSL yet).
# When a domain is pointed at this VPS, run:
#   sudo certbot --nginx -d your.domain.example
# That command rewrites this file to add the 443 server block + cert paths,
# and adds the http→https redirect automatically.
# ────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    # IP-based match so this site coexists with other domain-based vhosts on the box.
    # Add a hostname here once a domain is pointed at the VPS.
    server_name 109.199.121.116;

    # Reasonable client / proxy limits for a marketing site
    client_max_body_size 4m;

    # ACME / Let's Encrypt challenge path (kept reachable even when SSL is on)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:12090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/eztrove.access.log;
    error_log  /var/log/nginx/eztrove.error.log warn;
}


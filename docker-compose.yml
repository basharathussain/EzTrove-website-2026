services:
  web:
    build: .
    container_name: eztrove-web
    restart: unless-stopped
    ports:
      # Direct public exposure on 12090 (no host nginx in front).
      - "12090:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

services:
  web:
    build: .
    container_name: eztrove-web
    restart: unless-stopped
    ports:
      # Bind only to loopback — host nginx reverse-proxies public traffic.
      # Container is not directly exposed to the public internet.
      - "127.0.0.1:12090:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
